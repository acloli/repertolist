# ===== データベース接続設定 =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}

# ===== JPA設定 =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== CORS設定 =====
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}

# ===== ログ設定 =====
logging.level.work.fmhr.repertory=INFO
